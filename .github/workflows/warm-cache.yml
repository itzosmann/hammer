name: Warm Cache

on:
  schedule:
    # GitHub Actions minimum scheduled interval is 5 minutes.
    #
    # Every 5 minutes = 300 seconds
    - cron: "*/5 * * * *"

  # Allows you to run it manually from GitHub Actions
  workflow_dispatch:

jobs:
  warm-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Warm cache - 10 simultaneous instances
        env:
          INSTANCES: 10
        run: |
          echo "Starting $INSTANCES cache warming instances..."

          for i in $(seq 1 "$INSTANCES"); do
            echo "Starting instance #$i"
            python3 warm-cache.py http://eaziline.com/ &
          done

          echo "All $INSTANCES instances started."
          echo "Waiting for all instances to finish..."

          wait

          echo "All cache warming instances completed."